<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <div class="app-container">
        
        <div class="calculator-wrapper">
            <div class="top-bar">
                <h2>Calculator</h2>
                <div class="top-controls">
                    <button id="history-toggle" class="history-toggle-btn" title="Toggle History">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </button>
                    <div class="theme-switch-wrapper">
                        <label class="theme-switch" for="checkbox">
                            <input type="checkbox" id="checkbox" />
                            <div class="slider round">
                                <span class="icon sun">☀️</span>
                                <span class="icon moon">🌙</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <div class="main-content">
                <div class="calculator">
                    <div class="display">
                        <div class="previous-operand" id="previous-operand"></div>
                        <div class="current-operand" id="current-operand">0</div>
                    </div>
                    <div class="keypad">
                        <button class="btn btn-sci" data-action="sci" data-value="sin(">sin</button>
                        <button class="btn btn-sci" data-action="sci" data-value="cos(">cos</button>
                        <button class="btn btn-sci" data-action="sci" data-value="tan(">tan</button>
                        <button class="btn btn-action" data-action="clear">AC</button>
                        <button class="btn btn-action" data-action="delete">DEL</button>

                        <button class="btn btn-sci" data-action="sci" data-value="log(">log</button>
                        <button class="btn btn-sci" data-action="sci" data-value="ln(">ln</button>
                        <button class="btn btn-sci" data-action="sci" data-value="sqrt(">√</button>
                        <button class="btn btn-sci" data-action="sci" data-value="^">^</button>
                        <button class="btn btn-operator" data-action="append" data-value="/">÷</button>

                        <button class="btn btn-sci" data-action="sci" data-value="π">π</button>
                        <button class="btn btn-number" data-action="append" data-value="7">7</button>
                        <button class="btn btn-number" data-action="append" data-value="8">8</button>
                        <button class="btn btn-number" data-action="append" data-value="9">9</button>
                        <button class="btn btn-operator" data-action="append" data-value="*">×</button>

                        <button class="btn btn-sci" data-action="sci" data-value="e">e</button>
                        <button class="btn btn-number" data-action="append" data-value="4">4</button>
                        <button class="btn btn-number" data-action="append" data-value="5">5</button>
                        <button class="btn btn-number" data-action="append" data-value="6">6</button>
                        <button class="btn btn-operator" data-action="append" data-value="-">-</button>

                        <button class="btn btn-sci" data-action="append" data-value="(">(</button>
                        <button class="btn btn-number" data-action="append" data-value="1">1</button>
                        <button class="btn btn-number" data-action="append" data-value="2">2</button>
                        <button class="btn btn-number" data-action="append" data-value="3">3</button>
                        <button class="btn btn-operator" data-action="append" data-value="+">+</button>

                        <button class="btn btn-sci" data-action="append" data-value=")">)</button>
                        <button class="btn btn-number span-2" data-action="append" data-value="0">0</button>
                        <button class="btn btn-number" data-action="append" data-value=".">.</button>
                        <button class="btn btn-equal" data-action="calculate">=</button>
                    </div>
                </div>

                <div class="history-sidebar" id="history-sidebar">
                    <div class="history-header">
                        <h3>History</h3>
                        <button class="clear-history-btn" id="clear-history">Clear</button>
                    </div>
                    <div class="history-list" id="history-list">
                        <!-- History items will be injected here -->
                    </div>
                </div>
            </div>
        </div>

    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="script.js"></script>
</body>
</html>
